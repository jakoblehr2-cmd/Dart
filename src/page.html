<title>Dart Turnierplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: Kopfzeile, dann "Jetzt dran" + Tabelle, darunter der K.-o.-Baum in horizontal scrollbarem Container */
:root {
  --bg: #f1f4ef;
  --surface: #ffffff;
  --ink: #151a16;
  --muted: #5b665d;
  --line: #d6ddd3;
  --red: #c11d2c;
  --green: #0d7741;
  --green-soft: #dcefe3;
  --red-soft: #f8e1e3;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e120f; --surface: #172019; --ink: #ecf0ea; --muted: #97a399; --line: #2a352c;
    --red: #f0505c; --green: #45c180; --green-soft: #173a26; --red-soft: #3c1a1e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e120f; --surface: #172019; --ink: #ecf0ea; --muted: #97a399; --line: #2a352c;
  --red: #f0505c; --green: #45c180; --green-soft: #173a26; --red-soft: #3c1a1e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 2.4rem; line-height: 1; }
h2 { font-size: 1.5rem; }
.eyebrow { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .12em; font-size: .8rem; color: var(--muted); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* Kopf */
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.head .board { display: flex; align-items: center; gap: 12px; }
.ring { width: 44px; height: 44px; border-radius: 50%; flex: none;
  background: radial-gradient(circle, var(--red) 0 16%, var(--green) 16% 30%, var(--ink) 30% 46%, var(--surface) 46% 60%, var(--ink) 60% 74%, var(--red) 74% 86%, var(--ink) 86%); }
.meta { color: var(--muted); font-size: .9rem; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.danger { color: var(--red); border-color: var(--red); }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--green); }

/* Setup */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-weight: 600; font-size: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { border: 0; background: transparent; width: 42px; height: 42px; font-size: 1.3rem; }
.stepper output { min-width: 48px; text-align: center; font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; }
.quick button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.names .nm { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 0 0 0 10px; background: var(--bg); }
.names .nm span { font-family: var(--font-display); color: var(--muted); width: 1.6em; font-variant-numeric: tabular-nums; }
.names input { border: 0; background: transparent; padding: 10px 10px 10px 0; width: 100%; min-width: 0; }
.names input:focus { outline: none; }
.names .nm:focus-within { border-color: var(--red); }
select, .txt { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 10px; }
.check { display: flex; gap: 8px; align-items: center; }
.hint { color: var(--muted); font-size: .88rem; }

/* Turnieransicht */
.top { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .top { grid-template-columns: minmax(0, 1fr); } }
.sec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.next { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 14px; }

.champ { border-radius: 12px; padding: 18px 16px; background: var(--green-soft); border: 1px solid var(--green); display: flex; flex-direction: column; gap: 2px; }
.champ strong { font-family: var(--font-display); font-size: 2.2rem; line-height: 1.05; }

/* Tabelle */
.table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.table td { padding: 8px 12px; border-top: 1px solid var(--line); }
.table tr:first-child td { border-top: 0; }
.table .pl { font-family: var(--font-display); font-size: 1.15rem; width: 4.5em; font-variant-numeric: tabular-nums; }
.table tr.p1 .pl { color: var(--red); }
.table .sub { color: var(--muted); font-size: .85rem; text-align: right; }
.table .open td { color: var(--muted); }

/* Match-Karte */
.match { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; position: relative; }
.match.live { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
.match.bye { opacity: .55; }
.mhead { display: flex; justify-content: space-between; gap: 8px; padding: 4px 10px; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-family: var(--font-display); border-bottom: 1px solid var(--line); }
.mhead .tag { color: var(--red); }
.mrow { display: flex; align-items: stretch; }
.mrow + .mrow { border-top: 1px solid var(--line); }
.pick { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 9px 10px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick:disabled { cursor: default; }
.pick.ph { color: var(--muted); font-style: italic; font-weight: 400; }
.mrow.win { background: var(--green-soft); }
.mrow.win .pick { font-weight: 700; }
.mrow.win .pick::after { content: " ✓"; color: var(--green); }
.mrow.lose .pick { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--red); }
.legs { width: 44px; border: 0; border-left: 1px solid var(--line); background: transparent; text-align: center; font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.legs::-webkit-outer-spin-button, .legs::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.legs:disabled { color: var(--muted); }

/* Baum */
.bracket-wrap { overflow-x: auto; padding-bottom: 8px; }
.bracket { display: flex; gap: 28px; min-width: min-content; }
.round { display: flex; flex-direction: column; gap: 10px; width: 210px; flex: none; }
.round h3 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.round-m { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 14px; }
.round:not(:last-child) .round-m .match::after { content: ""; position: absolute; right: -15px; top: 50%; width: 14px; border-top: 2px solid var(--line); }
.bracket .match { overflow: visible; }
.bracket .match > :first-child { border-radius: 10px 10px 0 0; }
.third { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }

.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--red-soft); border-radius: 8px; padding: 8px 10px; }
@media (prefers-reduced-motion: no-preference) { .match, .mrow { transition: background .15s, border-color .15s; } }
/* Platzierungsspiele */
.groups { display: flex; flex-direction: column; gap: 20px; }
.pgroup { display: flex; flex-direction: column; gap: 8px; }
.pgroup h3 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .06em; }
.pcols { display: flex; gap: 20px; min-width: min-content; }
.pcol { display: flex; flex-direction: column; justify-content: space-around; gap: 12px; width: 210px; flex: none; }
.lab { display: flex; flex-direction: column; gap: 4px; }
.mhead .go { border: 0; background: var(--red); color: #fff; border-radius: 4px; padding: 1px 8px; font: inherit; letter-spacing: .06em; text-transform: uppercase; }

/* Zähler */
.ov { position: fixed; inset: 0; z-index: 10; background: var(--bg); overflow-y: auto;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); }
.sheet { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.x { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 40px; height: 40px; font-size: 1.1rem; }
.duel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pl-card { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pl-card.on { border-color: var(--red); }
.pl-card .who { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-card .rest { font-family: var(--font-display); font-size: 3.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.pl-card .sm { display: flex; justify-content: space-between; gap: 6px; color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
.pl-card .fin { color: var(--green); font-weight: 600; }
.dots { display: flex; gap: 4px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dots i.f { background: var(--green); border-color: var(--green); }
.msg { min-height: 1.4em; text-align: center; font-weight: 600; color: var(--red); }
.msg.ok { color: var(--green); }
.typed { font-family: var(--font-display); font-size: 2.6rem; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 2px; font-variant-numeric: tabular-nums; }
.typed .ph { color: var(--muted); }
.qs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.qs button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 0; font-family: var(--font-display); font-size: 1.1rem; }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.pad button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; height: 58px; font-family: var(--font-display); font-size: 1.7rem; }
.pad button:active, .qs button:active { background: var(--line); }
.pad .ok { background: var(--green); border-color: var(--green); color: #fff; font-size: 1.3rem; }
.sheet-foot { display: flex; justify-content: space-between; gap: 8px; }
.wonbox { text-align: center; padding: 24px 12px; background: var(--green-soft); border: 1px solid var(--green); border-radius: 12px; display: flex; flex-direction: column; gap: 4px; }
.wonbox strong { font-family: var(--font-display); font-size: 2.4rem; line-height: 1.05; }
</style>

<div class="wrap" id="app"></div>

<script src="app.js"></script>
