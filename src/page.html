<title>Dart Turnierplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style id="page-style">
/* Layout: Kopfzeile, dann "Jetzt dran" + Tabelle, darunter der K.-o.-Baum in horizontal scrollbarem Container */
:root {
  --bg: #f1f4ef;
  --surface: #ffffff;
  --ink: #151a16;
  --muted: #5b665d;
  --line: #d6ddd3;
  --red: #c11d2c;
  --green: #0d7741;
  --green-soft: #dcefe3;
  --red-soft: #f8e1e3;
  --font-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e120f; --surface: #172019; --ink: #ecf0ea; --muted: #97a399; --line: #2a352c;
    --red: #f0505c; --green: #45c180; --green-soft: #173a26; --red-soft: #3c1a1e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e120f; --surface: #172019; --ink: #ecf0ea; --muted: #97a399; --line: #2a352c;
  --red: #f0505c; --green: #45c180; --green-soft: #173a26; --red-soft: #3c1a1e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; }
.wrap { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: flex; flex-direction: column; gap: 24px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 2.4rem; line-height: 1; }
h2 { font-size: 1.5rem; }
.eyebrow { font-family: var(--font-display); text-transform: uppercase; letter-spacing: .12em; font-size: .8rem; color: var(--muted); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* Kopf */
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.head .board { display: flex; align-items: center; gap: 12px; }
.ring { width: 44px; height: 44px; border-radius: 50%; flex: none;
  background: radial-gradient(circle, var(--red) 0 16%, var(--green) 16% 30%, var(--ink) 30% 46%, var(--surface) 46% 60%, var(--ink) 60% 74%, var(--red) 74% 86%, var(--ink) 86%); }
.meta { color: var(--muted); font-size: .9rem; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 14px; font-weight: 600; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn.danger { color: var(--red); border-color: var(--red); }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--green); }

/* Setup */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-weight: 600; font-size: .9rem; }
.row { display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: end; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stepper button { border: 0; background: transparent; width: 42px; height: 42px; font-size: 1.3rem; }
.stepper output { min-width: 48px; text-align: center; font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.quick button { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px; }
.quick button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.names .nm { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 8px; padding: 0 0 0 10px; background: var(--bg); }
.names .nm span { font-family: var(--font-display); color: var(--muted); width: 1.6em; font-variant-numeric: tabular-nums; }
.names input { border: 0; background: transparent; padding: 10px 10px 10px 0; width: 100%; min-width: 0; }
.names input:focus { outline: none; }
.names .nm:focus-within { border-color: var(--red); }
select, .txt { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 10px; }
.check { display: flex; gap: 8px; align-items: center; }
.hint { color: var(--muted); font-size: .88rem; }

/* Turnieransicht */
.top { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .top { grid-template-columns: minmax(0, 1fr); } }
.sec { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.next { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.empty { color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; padding: 14px; }

.champ { border-radius: 12px; padding: 18px 16px; background: var(--green-soft); border: 1px solid var(--green); display: flex; flex-direction: column; gap: 2px; }
.champ strong { font-family: var(--font-display); font-size: 2.2rem; line-height: 1.05; }

/* Tabelle */
.table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.table td { padding: 8px 12px; border-top: 1px solid var(--line); }
.table tr:first-child td { border-top: 0; }
.table .pl { font-family: var(--font-display); font-size: 1.15rem; width: 4.5em; font-variant-numeric: tabular-nums; }
.table tr.p1 .pl { color: var(--red); }
.table .sub { color: var(--muted); font-size: .85rem; text-align: right; }
.table .open td { color: var(--muted); }

/* Match-Karte */
.match { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; position: relative; }
.match.live { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
.match.bye { opacity: .55; }
.mhead { display: flex; justify-content: space-between; gap: 8px; padding: 4px 10px; font-size: .75rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-family: var(--font-display); border-bottom: 1px solid var(--line); }
.mhead .tag { color: var(--red); }
.mrow { display: flex; align-items: stretch; }
.mrow + .mrow { border-top: 1px solid var(--line); }
.pick { flex: 1; min-width: 0; text-align: left; border: 0; background: transparent; padding: 9px 10px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick:disabled { cursor: default; }
.pick.ph { color: var(--muted); font-style: italic; font-weight: 400; }
.mrow.win { background: var(--green-soft); }
.mrow.win .pick { font-weight: 700; }
.mrow.win .pick::after { content: " ✓"; color: var(--green); }
.mrow.lose .pick { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--red); }
.legs { width: 44px; border: 0; border-left: 1px solid var(--line); background: transparent; text-align: center; font-family: var(--font-display); font-size: 1.15rem; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.legs::-webkit-outer-spin-button, .legs::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.legs:disabled { color: var(--muted); }

/* Baum */
.bracket-wrap { overflow-x: auto; padding-bottom: 8px; }
.bracket { display: flex; gap: 28px; min-width: min-content; }
.round { display: flex; flex-direction: column; gap: 10px; width: 210px; flex: none; }
.round h3 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.round-m { flex: 1; display: flex; flex-direction: column; justify-content: space-around; gap: 14px; }
.round:not(:last-child) .round-m .match::after { content: ""; position: absolute; right: -15px; top: 50%; width: 14px; border-top: 2px solid var(--line); }
.bracket .match { overflow: visible; }
.bracket .match > :first-child { border-radius: 10px 10px 0 0; }
.third { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }

.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--red-soft); border-radius: 8px; padding: 8px 10px; }
@media (prefers-reduced-motion: no-preference) { .match, .mrow { transition: background .15s, border-color .15s; } }
/* Platzierungsspiele */
.groups { display: flex; flex-direction: column; gap: 20px; }
.pgroup { display: flex; flex-direction: column; gap: 8px; }
.pgroup h3 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .06em; }
.pcols { display: flex; gap: 20px; min-width: min-content; }
.pcol { display: flex; flex-direction: column; justify-content: space-around; gap: 12px; width: 210px; flex: none; }
.lab { display: flex; flex-direction: column; gap: 4px; }
.mhead .go { border: 0; background: var(--red); color: #fff; border-radius: 4px; padding: 1px 8px; font: inherit; letter-spacing: .06em; text-transform: uppercase; }

/* Zähler: passt ohne Scrollen auf einen Handybildschirm, das Tastenfeld füllt den Rest */
.ov { position: fixed; inset: 0; z-index: 10; background: var(--bg); display: flex;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 12px calc(env(safe-area-inset-bottom, 0px) + 10px); }
.sheet { width: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.sheet-head .eyebrow { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.x { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; font-size: 1rem; flex: none; }
.duel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pl-card { background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pl-card.on { border-color: var(--red); }
.pl-card .who { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.pl-card .rest { font-family: var(--font-display); font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.pl-card .sm { display: flex; justify-content: space-between; align-items: center; gap: 6px; color: var(--muted); font-size: .8rem; font-variant-numeric: tabular-nums; min-width: 0; }
.pl-card .sm span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-card .co { font-family: var(--font-display); font-size: 1.05rem; letter-spacing: .04em; color: var(--green); min-height: 1.3em; }
.pl-card .co .no { color: var(--muted); font-size: .9rem; }
.dots { display: flex; gap: 3px; flex: none; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dots i.f { background: var(--green); border-color: var(--green); }
.msg { min-height: 1.3em; text-align: center; font-weight: 600; font-size: .9rem; color: var(--red); }
.msg.ok { color: var(--green); }
.visit { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 6px; align-items: center; }
.slot { border: 1px dashed var(--line); border-radius: 8px; text-align: center; padding: 5px 0; font-family: var(--font-display); font-size: 1.15rem; color: var(--muted); }
.slot.f { border-style: solid; background: var(--surface); color: var(--ink); }
.visit .sum { font-family: var(--font-display); font-size: 1.5rem; min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
.mods { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mods button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 0; font-weight: 600; }
.mods button[aria-pressed="true"] { background: var(--red); border-color: var(--red); color: #fff; }
.pad { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, 1fr); grid-auto-rows: minmax(40px, 1fr); gap: 6px; }
.pad button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; font-family: var(--font-display); font-size: 1.35rem; line-height: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.pad button small { font-family: var(--font-body); font-size: .7rem; color: var(--muted); }
.pad button:disabled { opacity: .35; }
.pad button:active { background: var(--line); }
.pad .ok { grid-column: span 2; background: var(--green); border-color: var(--green); color: #fff; font-size: 1.1rem; }
.sheet-foot { display: flex; justify-content: space-between; gap: 8px; }
.btn.big { padding: 14px; font-size: 1rem; }
.wonbox { text-align: center; padding: 20px 12px; background: var(--green-soft); border: 1px solid var(--green); border-radius: 12px; display: flex; flex-direction: column; gap: 4px; }
.wonbox strong { font-family: var(--font-display); font-size: 2.4rem; line-height: 1.05; }

/* Teilen & persönliche Ansicht */
.status { font-size: .85rem; color: var(--muted); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.status .ok { color: var(--green); font-weight: 600; }
.status .err { color: var(--red); font-weight: 600; }
.mecard { background: var(--surface); border: 2px solid var(--ink); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.mecard.turn { border-color: var(--red); background: var(--red-soft); }
.mecard .big { font-family: var(--font-display); font-size: 1.9rem; line-height: 1.05; }
.mecard select { align-self: flex-start; }
.mecard ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: .9rem; }
.mrow.me .pick, .table tr.me td { color: var(--red); font-weight: 700; }
.table tr.me td { background: var(--red-soft); }
.qrbox { background: #fff; padding: 28px; border-radius: 12px; align-self: center; line-height: 0; }
.qrbox svg { display: block; width: min(64vw, 260px); height: auto; }
.url { font-family: ui-monospace, Menlo, monospace; font-size: .85rem; word-break: break-all; user-select: all; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.ov.scroll { overflow-y: auto; }

/* Spielreihenfolge */
.sched { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); overflow: hidden; }
.srow { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); min-width: 0; }
.srow:first-child { border-top: 0; }
.srow .pos { font-family: var(--font-display); font-size: 1.2rem; width: 1.6em; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.srow .smain { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.srow .vs { overflow-wrap: anywhere; }
.srow .ph { color: var(--muted); font-style: italic; }
.srow .chip { flex: none; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .06em; font-size: .75rem; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--muted); }
.srow.now { background: var(--red-soft); }
.srow.now .chip { background: var(--red); border-color: var(--red); color: #fff; }
.srow.soon .chip { border-color: var(--red); color: var(--red); }
.srow.mine { box-shadow: inset 4px 0 0 var(--red); }
.srow.done .vs b { color: var(--green); }
.played summary { cursor: pointer; color: var(--muted); font-weight: 600; padding: 4px 0 8px; }

/* Start: große Scheibe als Blickfang, darunter zwei Auswahlkarten */
.mini { width: 44px; height: 44px; flex: none; display: block; }
.mini svg { width: 100%; height: 100%; display: block; }
.mini text { display: none; }
.btn.ghost { background: transparent; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr); justify-items: center; text-align: center; gap: 18px; padding-block: 8px 0; }
.hero-board { width: min(68vw, 300px); aspect-ratio: 1; max-width: 100%; filter: drop-shadow(0 14px 28px rgba(0, 0, 0, .28)); }
.hero-board svg { width: 100%; height: 100%; display: block; }
.hero-text { display: flex; flex-direction: column; gap: 6px; align-items: center; }
.display { font-size: clamp(3.2rem, 14vw, 5.6rem); line-height: .9; text-transform: uppercase; letter-spacing: -.01em; }
.hero-text p { margin: 0; color: var(--muted); max-width: 34ch; }
@media (min-width: 760px) {
  .hero { grid-template-columns: auto minmax(0, 1fr); justify-items: start; text-align: left; align-items: center; gap: 40px; }
  .hero-text { align-items: flex-start; }
}
@media (prefers-reduced-motion: no-preference) {
  .hero-board { animation: spin-in .9s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes spin-in { from { transform: rotate(-54deg) scale(.92); } to { transform: none; } }
}
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.choice { position: relative; text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 16px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: border-color .15s, transform .15s; }
.choice:hover { border-color: var(--ink); }
.choice:active { transform: scale(.99); }
.choice strong { font-family: var(--font-display); font-size: 2.2rem; line-height: 1; text-transform: uppercase; }
.choice .desc { color: var(--muted); }
.choice .cta { margin-top: 10px; font-weight: 600; }
.choice.single .cta { color: var(--red); }
.choice.tour .cta { color: var(--green); }
.choice .ico { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; }
.choice .ico svg { width: 100%; height: 100%; fill: none; stroke-width: 3; }
.choice.single .ico svg { stroke: var(--red); }
.choice.single .ico .fill { fill: var(--red); }
.choice.tour .ico svg { stroke: var(--green); stroke-linejoin: round; }

/* Einzelspiel-Einrichtung */
.duo { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; align-items: center; }
.duo .txt { width: 100%; min-width: 0; font-size: 1.05rem; }
.vsx { font-family: var(--font-display); color: var(--muted); text-transform: uppercase; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 9px 14px; font-weight: 600; min-width: 44px; max-width: 14em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.resume { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: var(--green-soft); border: 1px solid var(--green); border-radius: 12px; padding: 10px 14px; }
.loading { display: flex; gap: 12px; align-items: center; color: var(--muted); }
</style>

<div class="wrap" id="app"></div>

<script type="application/json" id="shared">null</script>
